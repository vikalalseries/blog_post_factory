<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog Post Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F9;--surface:#fff;--ink:#111827;--ink2:#374151;--mut:#5B6475;--line:#E5E7EB;--line2:#D1D5DB;
  --brand:#4338CA;--brand-d:#3730A3;--brand-l:#EEF2FF;--side:#1B1F3B;--side2:#2A2F57;--side-ink:#C7CBE0;
  --ok:#15803D;--ok-l:#DCFCE7;--warn-l:#FEF3C7;--warn:#92400E;--bad:#B91C1C;--bad-l:#FEE2E2;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.mut{font-size:13px;color:var(--mut)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.btn{font:600 14px Inter,Arial,sans-serif;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:#fff;cursor:pointer;transition:background .15s}
.btn:hover:not(:disabled){background:#F3F4F6}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--brand-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ico{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:#fff;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:background .15s}
.ico:hover:not(:disabled){background:#F3F4F6}
.ico.fill{background:var(--brand);border-color:var(--brand);color:#fff}
.ico.fill:hover:not(:disabled){background:var(--brand-d)}
.ico.bare{border-color:transparent;background:transparent}
.ico:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}

/* layout */
.app{display:flex;height:100vh;height:100dvh}
aside.side{width:272px;flex:none;background:var(--side);padding:16px 12px;display:flex;flex-direction:column;gap:12px;overflow:hidden;color:var(--side-ink);transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff;font-weight:700;font-size:16px}
.newchat{width:100%;background:#fff;color:var(--side);border-color:#fff}
.newchat:hover:not(:disabled){background:#E0E7FF!important}
.search{height:44px;border-radius:999px;border:1px solid #3A4070;background:var(--side2);display:flex;align-items:center;gap:8px;padding:0 14px}
.search input{flex:1;min-width:0;background:none;border:0;color:#fff;font:14px Inter,Arial,sans-serif;outline:0}
.search input::placeholder{color:#9AA0C4}
.search:focus-within{border-color:#8B93E8}
.chats{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
.chats .lbl{color:#8E94BD;padding:10px 10px 4px}
.chatrow{display:flex;align-items:center;gap:6px;border-radius:10px}
.chatrow:hover{background:#242949}
.chatrow.on{background:var(--side2)}
.chatrow .t{flex:1;min-width:0;min-height:44px;text-align:left;background:none;border:0;padding:0 10px;font-size:14px;color:var(--side-ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatrow.on .t{color:#fff;font-weight:600}
.chatrow .x{width:32px;height:32px;margin-right:6px;border-radius:8px;border:0;background:none;color:#8E94BD;cursor:pointer;opacity:0;font-size:16px}
.chatrow:hover .x,.chatrow .x:focus-visible{opacity:1}
.chatrow .x:hover{background:#3A4070;color:#fff}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--side-ink);background:none;border:0;width:100%;text-align:left;cursor:pointer}
.nav:hover{background:#242949}
.nav.on{background:var(--side2);color:#fff}
.modelbox{border-radius:10px;border:1px dashed #3A4070;padding:10px 12px;font-size:12px;color:var(--side-ink)}
.modelbox b{color:#fff}
.scrim{display:none}

main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:68px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 24px}
.top h1{margin:0;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .right{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.top .left{display:flex;align-items:center;gap:8px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:#fff;gap:2px}
.sg{min-height:40px;padding:0 18px;border-radius:999px;border:0;background:transparent;font:600 13px Inter,Arial,sans-serif;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sg:hover:not(.on){background:#F3F4F6}
.sg.on{background:var(--brand);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:#C7CBE0;flex:none}
.dot.run{background:#F59E0B;animation:pulse 1s infinite}
.dot.ok{background:#22C55E}
.dot.bad{background:#EF4444}
.sg.on .dot:not(.run):not(.ok):not(.bad){background:#A5B4FC}
@keyframes pulse{50%{opacity:.35}}
.menu-btn{display:none}

.page{flex:1;min-height:0;overflow:auto;padding:8px 24px 24px}
.thread{flex:1;min-height:0;overflow:auto;padding:8px 24px;scroll-behavior:smooth}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.me{display:flex;justify-content:flex-end}
.bub{max-width:80%;padding:12px 16px;background:var(--brand);color:#fff;border-radius:20px 20px 4px 20px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.bub small{display:block;margin-top:4px;opacity:.75;font-size:12px}
.bot{display:flex;gap:12px}
.avatar{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--brand-l)}
.botbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.botbody>p{margin:0;font-size:15px;line-height:1.5}
.result{padding:16px;display:flex;flex-direction:column;gap:12px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rhead strong{font-size:15px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line2);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink2);background:#fff}
.chip.ok{border-style:solid;border-color:#86EFAC;background:var(--ok-l);color:#166534}
.chip.run{border-style:solid;border-color:#FCD34D;background:var(--warn-l);color:var(--warn)}
.chip.bad{border-style:solid;border-color:#FCA5A5;background:var(--bad-l);color:#991B1B}
.spin{animation:spin 1s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.fcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;color:var(--ink2);background:#FAFAFC}
.fcard .src{display:inline-block;margin-top:8px;padding:2px 10px;border:1px dashed var(--line2);border-radius:999px;font-size:11px;font-weight:600;color:var(--mut);background:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.post{border:1px solid var(--line);border-radius:12px;padding:20px 24px;max-height:min(52vh,560px);overflow:auto;background:#fff}
.post img{display:block;max-width:100%;max-height:260px;margin:4px auto 14px;border-radius:10px;object-fit:cover}
.post h2{margin:0 0 14px;font-family:'Source Serif 4',Georgia,serif;font-size:26px;line-height:1.25}
.post h3{margin:20px 0 8px;font-size:17px}
.post p{margin:0 0 12px;font-size:15px;line-height:1.75;color:var(--ink2)}
.post ul{margin:0 0 12px;padding-left:20px;font-size:15px;line-height:1.7;color:var(--ink2)}
.post a{color:var(--brand)}
.placeholder{color:#8A93A5;font-size:14px;margin:0}
.ract{display:flex;gap:8px;flex-wrap:wrap}
.mini{display:flex;gap:4px}
.mini button{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--mut);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.mini button:hover{background:#E5E7EB;color:var(--ink)}
.err{color:var(--bad);background:var(--bad-l);border-radius:10px;padding:10px 14px;font-size:14px}

/* empty state */
.empty{max-width:640px;margin:8vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 8px}
.empty h2{margin:0;font-family:'Source Serif 4',Georgia,serif;font-size:32px;line-height:1.2}
.empty p{margin:0;color:var(--mut);font-size:15px;line-height:1.5}
.sugg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.sugg button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:#fff;font:500 14px Inter,Arial,sans-serif;cursor:pointer}
.sugg button:hover{background:var(--brand-l);border-color:#A5B4FC}

/* composer - ChatGPT-style pill, same on desktop and mobile */
.dock{flex:none;padding:8px 24px calc(14px + env(safe-area-inset-bottom))}
.dockin{max-width:820px;margin:0 auto;position:relative}
.composer{background:#fff;border:1px solid var(--line2);border-radius:999px;padding:6px;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"l t r";align-items:end;gap:0 4px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.composer.multi{grid-template-columns:1fr auto;grid-template-areas:"t t" "l r";border-radius:26px;row-gap:2px}
.composer:focus-within{border-color:#10A37F;box-shadow:0 0 0 3px rgba(16,163,127,.25),var(--shadow)}
.composer textarea{grid-area:t;min-width:0;width:100%;resize:none;border:0;outline:0;background:transparent;font:14px/21px Inter,Arial,sans-serif;color:var(--ink);padding:9px 8px;height:40px;max-height:200px;overflow-y:auto;scrollbar-width:none}
.composer textarea::-webkit-scrollbar{display:none}
.composer textarea::placeholder{color:#8A93A5}
.cl{grid-area:l;display:flex;gap:2px}
.cr{grid-area:r;display:flex;gap:4px;align-items:center}
.composer .ico{width:40px;height:40px;border-color:transparent;background:transparent}
.composer .ico:hover:not(:disabled){background:#F3F4F6}
.composer .ico.fill{background:var(--ink);border-color:var(--ink);color:#fff}
.composer .ico.fill:hover:not(:disabled){background:#374151}
.composer .ico.fill:disabled{background:#D1D5DB;border-color:#D1D5DB;opacity:1}
#optBtn,#optBtn:hover:not(:disabled){background:transparent;transition:none}
.composer .ico.rec{background:var(--bad-l);color:var(--bad);animation:pulse 1.2s infinite}
.ghostmirror{position:absolute;left:-9999px;top:0;visibility:hidden;height:0;overflow:hidden;padding:9px 8px;border:0;font:14px/21px Inter,Arial,sans-serif;resize:none}
@media (max-width:640px){.composer textarea,.ghostmirror{font-size:16px;line-height:24px;max-height:140px}}
.foot{text-align:center;margin-top:8px;font-size:12px;color:var(--mut)}
.pop{position:absolute;left:0;bottom:100%;margin-bottom:10px;width:min(320px,100%);background:#fff;border:1px solid var(--line2);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow);z-index:5}
.pop .lbl{padding:8px 6px 2px}
.prow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;padding:0 6px;border:0;border-bottom:1px solid var(--line);background:none;font:600 14px Inter,Arial,sans-serif;cursor:pointer;text-align:left}
.prow:last-child{border-bottom:0}
.prow:hover{background:#F9FAFB}
.prow span+span{font-weight:400;color:var(--mut)}
.opts{display:flex;flex-wrap:wrap;gap:8px;padding:8px 4px 10px}
.opt{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font:600 13px Inter,Arial,sans-serif;cursor:pointer;white-space:nowrap}
.opt:hover{background:#F3F4F6}
.opt.on{background:var(--brand);border-color:var(--brand);color:#fff}
.back{display:flex;align-items:center;gap:6px;min-height:44px;background:none;border:0;font:600 13px Inter,Arial,sans-serif;color:var(--mut);cursor:pointer;padding:0 4px}

/* secondary pages */
.pcol{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.saved{display:flex;gap:16px;height:100%;min-height:0}
.plist{width:300px;flex:none;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.pitem{text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;cursor:pointer;font:inherit;min-height:44px}
.pitem:hover{background:#F3F4F6}.pitem.on{border-color:var(--brand);background:var(--brand-l)}
.pitem b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem span{font-size:12px;color:var(--mut)}
.viewer{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.viewer .post{flex:1;max-height:none;border:0;border-radius:14px 14px 0 0}
.viewer .vfoot{border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.srcrow{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.srcrow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcrow .mut{flex:none}
.linkin{flex:1;min-width:0;height:44px;border:1px solid var(--line2);border-radius:999px;padding:0 16px;font:14px Inter,Arial,sans-serif}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:30;max-width:90vw}

/* mobile */
@media (max-width:900px){
  aside.side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);width:min(300px,86vw)}
  body.nav-open aside.side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:19}
  .menu-btn{display:inline-flex}
  .top{padding:0 10px 6px;grid-template-columns:1fr auto;grid-template-rows:56px auto;gap:0 8px;height:auto}
  .top .segwrap{grid-column:1/-1;grid-row:2;display:flex;justify-content:center}
  .top .left{grid-column:1;grid-row:1}
  .top .right{grid-column:2;grid-row:1}
  .sg{min-height:36px;padding:0 14px;font-size:12px}
  .thread,.page{padding-left:14px;padding-right:14px}
  .dock{padding-left:12px;padding-right:12px}
  .bub{max-width:88%}
  .post{padding:16px}
  .post h2{font-size:22px}
  .empty{margin-top:4vh}.empty h2{font-size:26px}
  .saved{flex-direction:column;height:auto}
  .plist{width:auto;max-height:220px}
  .viewer .post{max-height:60vh}
  .hide-sm{display:none}
}
@media (max-width:900px){
  html,body{width:100%;max-width:100vw;overflow:hidden}
  .app{width:100%}
  main{width:100%;overflow:hidden}
  .thread,.page,.chats,.post,.plist{scrollbar-width:none;-ms-overflow-style:none}
  .thread::-webkit-scrollbar,.page::-webkit-scrollbar,.chats::-webkit-scrollbar,.post::-webkit-scrollbar,.plist::-webkit-scrollbar{display:none}
  .col,.botbody,.result,.card{min-width:0;max-width:100%}
  .dock{padding:6px 10px calc(10px + env(safe-area-inset-bottom))}
  .composer{padding:4px;gap:0 2px}
  .composer .ico{width:40px;height:40px}
  .cl{gap:0}.cr{gap:2px}
  .foot{display:none}
  .pop{width:min(300px,calc(100vw - 20px))}
  .toast{bottom:84px}
  .steps .chip{font-size:11px;padding:4px 10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="dots" aria-hidden="true" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:-1"></canvas>
<div class="app">
<div class="scrim" id="scrim"></div>
<aside class="side" id="side" aria-label="Sidebar">
  <div class="brand">
    <svg aria-hidden="true" width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#6366F1"/><path d="M9 21V11l7 4 7-4v10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Blog Post Factory
  </div>
  <button id="newChat" class="btn newchat" type="button">+ New chat</button>
  <label class="search"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA0C4" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="chatSearch" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off"></label>
  <div id="chatList" class="chats" role="list"></div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <button class="nav" data-view="saved" type="button"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM4 10h16"/></svg>Saved posts</button>
    <button class="nav" data-view="sources" type="button"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1 3-2 8-2s8 1 8 2-3 2-8 2-8-1-8-2zM4 6v12c0 1 3 2 8 2s8-1 8-2V6"/></svg>Sources library</button>
  </div>
</aside>

<main>
  <header class="top">
    <div class="left">
      <button id="menuBtn" class="ico bare menu-btn" type="button" aria-label="Open menu"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="title">New chat</h1>
    </div>
    <div id="segwrap" class="segwrap"><div class="seg" role="group" aria-label="Agent view">
      <button class="sg" type="button" data-agent="researcher" aria-pressed="false"><span class="dot"></span>Research</button>
      <button class="sg" type="button" data-agent="writer" aria-pressed="false"><span class="dot"></span>Writer</button>
      <button class="sg" type="button" data-agent="editor" aria-pressed="true"><span class="dot"></span>Editor</button>
    </div></div>
    <div class="right">
      <button id="saveTop" class="btn hide-sm" type="button" disabled>Save to file</button>
      <button id="newChatTop" class="ico bare menu-btn" type="button" aria-label="New chat"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </header>

  <!-- CHAT -->
  <section id="view-chat" style="flex:1;min-height:0;display:flex;flex-direction:column">
    <div id="thread" class="thread" aria-live="polite"></div>
    <div class="dock">
      <div class="dockin">
        <div id="pop" class="pop hidden" role="menu"></div>
        <form id="composer" class="composer" autocomplete="off">
          <textarea id="topic" rows="1" placeholder="Write about a topic..." aria-label="Blog post topic" enterkeyhint="send"></textarea>
          <div class="cl">
            <button id="optBtn" class="ico" type="button" aria-label="Options: tone, length, images" aria-haspopup="true" aria-expanded="false" style="font-size:24px;font-weight:400">+</button>
            <button id="attachBtn" class="ico" type="button" aria-label="Attach a file to the sources library"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg></button>
          </div>
          <div class="cr">
            <button id="micBtn" class="ico" type="button" aria-label="Speak instead of typing" aria-pressed="false"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
            <button id="sendBtn" class="ico fill" type="submit" aria-label="Send" disabled><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </div>
        </form>

<script src="/static/deepgram_mic.js"></script>
<script>

}

// ---------- helpers ----------
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

const ICON = {
  running: '<svg class="spin" width="14" height="14" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="40 40"/></svg>',

// ---------- sidebar ----------
function renderChats() {
  const q = $("#chatSearch").value.trim().toLowerCase();
  const list = chats.filter(c => !q || c.topic.toLowerCase().includes(q));
  const today = new Date().toDateString();
  const groups = [["Today", list.filter(c => new Date(c.ts).toDateString() === today)], ["Earlier", list.filter(c => new Date(c.ts).toDateString() !== today)]];
  $("#chatList").innerHTML = list.length ? groups.filter(g => g[1].length).map(([name, items]) =>
    `<div class="lbl">${name}</div>` + items.map(c => `<div class="chatrow${c.id === cur && view === "chat" ? " on" : ""}" role="listitem"><button class="t" type="button" data-id="${c.id}" title="${esc(c.topic)}">${esc(c.title || c.topic)}</button><button class="x" type="button" data-del="${c.id}" aria-label="Delete chat ${esc(c.topic)}">✕</button></div>`).join("")).join("")

function openChat(id) { cur = id; const c = getChat(); if (c && c.status !== "running") agent = "editor"; show("chat"); closeNav(); }

const openNav = () => { document.body.classList.add("nav-open"); };

// ---------- rendering ----------

function renderThread() {

    <div class="bot"><div class="avatar" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 32 32"><path d="M9 21V11l7 4 7-4v10" fill="none" stroke="#4338CA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="botbody"><p>${esc(botIntro(c))}</p>${stepChips(c)}${c.error ? `<div class="err" role="alert">${esc(c.error)}</div>` : ""}${c.status === "empty" ? "" : agentCard(c)}

// ---------- composer ----------
let popMenu = null, popOpen = false;
function renderPop() {

  if (!popOpen) return;
  const row = (k, name, val) => `<button class="prow" type="button" role="menuitem" data-menu="${k}"><span>${name}</span><span>${esc(val)} ›</span></button>`;
  if (!popMenu) {

function setPop(open) { popOpen = open; if (!open) popMenu = null; renderPop(); }
const touch = matchMedia("(pointer:coarse)");
function updateComposer() {

window.addEventListener("resize", updateComposer);

// ---------- voice typing (static/deepgram_mic.js: live streaming, or short pieces as a fallback) ----------
const mic = createMic({ input: $("#topic"), button: $("#micBtn"), onError: toast, onChange: updateComposer });

// ---------- generate ----------
const normTopic = t => t.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim();

function findFacts(topic, except) {
  const n = normTopic(topic);
  const hit = chats.find(x => x !== except && x.facts && parseFacts(x.facts).length && normTopic(x.topic) === n);

}
function makeTitle(t) { return t.length > 48 ? t.slice(0, 46).trimEnd() + "…" : t; }
async function generate(topic, o, existing, fresh = false) {

}
async function submitTopic(text) {

  chats.unshift(c); cur = c.id; view = "chat"; running = true; renderAll();
  let r = { intent: "topic" };
  if (!findFacts(topic, c)) try {   // a topic we already researched is obviously a topic: skip the check
    const res = await fetch("/api/classify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: topic }) });
    if (res.ok) r = await res.json();
  } catch {}   // detector unreachable: don't block the user, treat it as a topic
  running = false;
  if (r.intent === "topic") { generate(topic, c.opts, c); return; }
  Object.assign(c, { status: "reply", intent: r.intent, reply: r.reply, suggestions: r.suggestions || [] });
  persist(); renderAll();
}
function pickSuggestion(topic) {
  const c = getChat(); if (!c || running) return;
  c.topic = topic; c.title = makeTitle(topic); generate(topic, c.opts, c);
}

// ---------- actions ----------
async function copyMd() {
  const c = getChat(); if (!c) return;
  try { await navigator.clipboard.writeText(c.final); toast("Markdown copied"); }
  catch { toast("Copy failed — select the text manually"); }
}
async function savePost() {
  const c = getChat(); if (!c || !c.final) return;
  $("#saveTop").disabled = true;
  try {
    const r = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ post: c.final, topic: c.topic }) });
    if (!r.ok) throw new Error("Save failed");
    toast("Post saved successfully");
  } catch (e) { toast(e.message); }
  renderHeader();
}
let openPost = null;
async function loadSaved(select) {
  try {
    const { posts } = await (await fetch("/api/posts")).json();
    $("#savedList").innerHTML = posts.length
      ? posts.map(p => `<button type="button" class="pitem${p.name === select ? " on" : ""}" data-name="${esc(p.name)}"><b>${esc(p.title)}</b><span>${new Date(p.modified * 1000).toLocaleString()}</span></button>`).join("")
      : '<div class="mut">Nothing saved yet. Generate a post and press “Save to file”.</div>';
    $$(".pitem").forEach(b => b.addEventListener("click", () => openSaved(b.dataset.name)));
  } catch { toast("Could not load saved posts"); }
}
async function openSaved(name) {
  try {
    const r = await fetch("/api/posts/" + encodeURIComponent(name));
    if (!r.ok) throw new Error();
    const d = await r.json();
    openPost = d;
    $("#savedBody").innerHTML = md(d.content);
    $("#savedName").textContent = d.name;
    $("#exPdf").disabled = $("#exTxt").disabled = false;
    $$(".pitem").forEach(b => b.classList.toggle("on", b.dataset.name === name));
  } catch { toast("Could not open the post"); }
}
function toPlain(m) {
  const NL = String.fromCharCode(10);
  return m.split(NL).filter(l => !/^!\[/.test(l.trim()))
    .map(l => l.replace(/^#{1,6}\s+/, "").replace(/\*\*(.+?)\*\*/g, "$1").replace(/\*(.+?)\*/g, "$1").replace(/^[-*]\s+/, "- "))
    .join(NL).replace(new RegExp(NL + "{3,}", "g"), NL + NL).trim() + NL;
}
function exportTxt() {
  if (!openPost) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([toPlain(openPost.content)], { type: "text/plain;charset=utf-8" }));
  a.download = openPost.name.replace(/\.md$/, ".txt"); a.click(); URL.revokeObjectURL(a.href);
}
async function exportPdf() {
  if (!openPost) return;
  const b = $("#exPdf"); b.disabled = true; b.textContent = "Preparing…";
  try {
    const r = await fetch("/api/posts/" + encodeURIComponent(openPost.name) + "/pdf");
    if (!r.ok) throw new Error();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob());
    a.download = openPost.name.replace(/\.md$/, ".pdf"); a.click(); URL.revokeObjectURL(a.href);
  } catch { toast("PDF export failed"); }
  b.disabled = false; b.textContent = "Export PDF";
}

// ---------- sources ----------
function renderSources(d) {
  $("#srcCount").textContent = `${d.files.length} file${d.files.length === 1 ? "" : "s"}`;
  $("#srcList").innerHTML = d.files.map(f => `<div class="srcrow"><span>${esc(f.name)}</span><span class="mut">${f.chunks} chunks</span></div>`).join("") || '<div class="mut">No files yet.</div>';
}
async function loadConfig() {
  try {
    const d = await (await fetch("/api/config")).json();
    renderSources(d);
  } catch { toast("Could not reach the server"); }
}
async function addFiles(files) {
  toast("Reading files…");
  const payload = await Promise.all([...files].map(async f => {
    if (!/\.pdf$/i.test(f.name)) return { name: f.name, content: await f.text() };
    const bytes = new Uint8Array(await f.arrayBuffer());
    let bin = "";
    for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode(...bytes.subarray(i, i + 32768));
    return { name: f.name, content: btoa(bin), encoding: "base64" };
  }));
  const r = await fetch("/api/sources", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ files: payload }) });
  if (!r.ok) { toast((await r.json().catch(() => ({}))).detail || "Upload failed"); return; }
  renderSources(await r.json()); toast(`${payload.length} file(s) added — re-run ingestion to index them`);
}
async function addLink() {
  const url = $("#linkUrl").value.trim();
  if (!url) return;
  const b = $("#addLink"); b.disabled = true; b.textContent = "Fetching…";
  try {
    const r = await fetch("/api/sources/link", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "Could not add link");
    renderSources(await r.json()); $("#linkUrl").value = ""; toast("Link added — re-run ingestion to index it");
  } catch (e) { toast(e.message); }
  b.disabled = false; b.textContent = "Add link";
}
async function ingest() {
  const b = $("#ingest"); b.disabled = true; b.textContent = "Ingesting…";
  try {
    const r = await fetch("/api/ingest", { method: "POST" });
    if (!r.ok) throw new Error("Ingestion failed");
    const d = await r.json(); renderSources(d); toast(`Ingested ${d.chunks} chunks`);
  } catch (e) { toast(e.message); }
  b.disabled = false; b.textContent = "Re-run ingestion";
}

// ---------- navigation ----------
function show(v) {
  view = v;
  $$(".nav").forEach(n => n.classList.toggle("on", n.dataset.view === v));
  ["chat", "saved", "sources"].forEach(x => $("#view-" + x).classList.toggle("hidden", x !== v));
  $("#view-chat").style.display = v === "chat" ? "flex" : "none";
  if (v === "saved") loadSaved(openPost && openPost.name);
  setPop(false); renderAll();
  if (v !== "chat") closeNav();
}

// ---------- events ----------
$("#newChat").addEventListener("click", newChat);
$("#newChatTop").addEventListener("click", newChat);
$("#menuBtn").addEventListener("click", openNav);
$("#scrim").addEventListener("click", closeNav);
$("#chatSearch").addEventListener("input", renderChats);
$("#chatList").addEventListener("click", e => {
  const d = e.target.closest("[data-del]"); if (d) { delChat(d.dataset.del); return; }
  const t = e.target.closest("[data-id]"); if (t) { if (running && t.dataset.id !== cur) { toast("Wait for the current post to finish."); return; } openChat(t.dataset.id); }
});
$$(".nav").forEach(n => n.addEventListener("click", () => show(n.dataset.view)));
$$(".sg").forEach(b => b.addEventListener("click", () => { agent = b.dataset.agent; renderSeg(); renderThread(); }));
$("#saveTop").addEventListener("click", savePost);
$("#thread").addEventListener("click", e => {
  const s = e.target.closest("[data-sugg]"); if (s) { $("#topic").value = s.dataset.sugg; $("#topic").focus(); updateComposer(); return; }
  const tp = e.target.closest("[data-topic]"); if (tp) { pickSuggestion(tp.dataset.topic); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const c = getChat();
  if (a.dataset.act === "copy") copyMd();
  else if (a.dataset.act === "save") savePost();
  else if (a.dataset.act === "toEditor") { agent = "editor"; renderSeg(); renderThread(); }
  else if (a.dataset.act === "regen" && c) generate(c.topic, c.opts, c);
  else if (a.dataset.act === "fresh" && c) generate(c.topic, c.opts, c, true);
});
$("#composer").addEventListener("submit", e => { e.preventDefault(); submitTopic(); });
$("#topic").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !touch.matches) { e.preventDefault(); submitTopic(); } });
$("#topic").addEventListener("input", updateComposer);
$("#optBtn").addEventListener("click", () => setPop(!popOpen));
$("#pop").addEventListener("click", e => {
  e.stopPropagation(); // content is re-rendered below; keep the outside-click handler from closing the menu
  const m = e.target.closest("[data-menu]"); if (m) { popMenu = m.dataset.menu || null; renderPop(); return; }
  const s = e.target.closest("[data-set]"); if (s) { opts[popMenu] = s.dataset.set; persistOpts(); popMenu = null; renderPop(); }
});
document.addEventListener("click", e => { if (popOpen && !e.target.closest("#pop,#optBtn")) setPop(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (popOpen) { setPop(false); $("#optBtn").focus(); } else closeNav(); } });
$("#attachBtn").addEventListener("click", () => $("#fileInput").click());
$("#addFiles").addEventListener("click", () => $("#fileInput").click());
$("#fileInput").addEventListener("change", e => { if (e.target.files.length) addFiles(e.target.files); e.target.value = ""; });
$("#exPdf").addEventListener("click", exportPdf);
$("#exTxt").addEventListener("click", exportTxt);
$("#ingest").addEventListener("click", ingest);
$("#addLink").addEventListener("click", addLink);
$("#linkUrl").addEventListener("keydown", e => { if (e.key === "Enter") addLink(); });

// ---------- interactive dotted background ----------
// A grid of small dots that slide away from the cursor with spring physics and bounce back.
(function dottedBackground() {
  const canvas = $("#dots"), ctx = canvas.getContext("2d");
  const spacing = 32, mouse = { x: null, y: null, radius: 110 };
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const BASE = "rgba(17, 24, 39, 0.10)", ACTIVE = "rgba(67, 56, 202, 0.35)";   // dark-grey dots, brand-indigo near the cursor
  let dots = [], w = 0, h = 0, raf = 0;

  function init() {
    const dpr = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dots = [];
    for (let x = spacing / 2; x < w; x += spacing)
      for (let y = spacing / 2; y < h; y += spacing)
        dots.push({ bx: x, by: y, x, y, vx: 0, vy: 0, size: 1.5 });
  }
  function frame() {
    ctx.clearRect(0, 0, w, h);
    for (const d of dots) {
      let dist = 0, close = false;
      if (mouse.x !== null) {
        const dx = mouse.x - d.x, dy = mouse.y - d.y;
        dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < mouse.radius) {
          close = true;
          const force = (mouse.radius - dist) / mouse.radius, a = Math.atan2(dy, dx);
          d.vx -= Math.cos(a) * force * 8;   // push away from the cursor
          d.vy -= Math.sin(a) * force * 8;
        }
      }
      d.vx += (d.bx - d.x) * 0.06;           // spring back to the grid position
      d.vy += (d.by - d.y) * 0.06;
      d.vx *= 0.82; d.vy *= 0.82;            // friction
      d.x += d.vx; d.y += d.vy;
      ctx.beginPath();
      ctx.arc(d.x, d.y, close ? d.size + (1 - dist / mouse.radius) * 1.8 : d.size, 0, Math.PI * 2);
      ctx.fillStyle = close ? ACTIVE : BASE;
      ctx.fill();
    }
    if (!still) raf = requestAnimationFrame(frame);
  }
  window.addEventListener("resize", () => { init(); if (still) frame(); });
  window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.addEventListener("mouseleave", () => { mouse.x = mouse.y = null; });
  init(); frame();
})();

show("chat"); loadConfig();
</script>
